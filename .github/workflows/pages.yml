name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand the uploaded source bundle once
        shell: bash
        run: |
          if compgen -G "fluff-source-bundle.part*" > /dev/null; then
            cp .github/workflows/pages.yml /tmp/fluff-pages.yml
            cat fluff-source-bundle.part* | base64 --decode > source-bundle.tar.xz
            tar -xJf source-bundle.tar.xz -C .
            mkdir -p .github/workflows
            cp /tmp/fluff-pages.yml .github/workflows/pages.yml
            rm -f source-bundle.tar.xz fluff-source-bundle.part* source-bundle.tar.xz.part*
          fi
      - name: Materialize the normal source tree in main
        shell: bash
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: materialize Fluff source tree [skip ci]"
            git push
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
